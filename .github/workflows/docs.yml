name: docs

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: doxygen
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # doxygen alone is enough for the HTML. graphviz only adds the diagrams,
      # and is one apt package rather than a toolchain.
      - name: Install doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Report versions
        run: doxygen --version && dot -V

      - name: Generate
        run: doxygen Doxyfile

      # The baseline is zero warnings, so anything in the log is a regression
      # rather than background noise and fails the job. Checked here rather than
      # with WARN_AS_ERROR so the site is still generated in full: the log gets
      # printed with the failure, and the artifact below still uploads.
      - name: Check for undocumented API
        run: |
          if [ -s docs/warnings.log ]; then
            echo "::error::Doxygen reported undocumented API:"
            cat docs/warnings.log
            exit 1
          fi
          echo "No documentation warnings."

      # Runs even when the check above failed, since that is exactly when the
      # generated site is worth looking at.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-docs
          path: docs/html
          retention-days: 14
